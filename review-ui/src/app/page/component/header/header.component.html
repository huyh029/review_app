<header class="flex items-center justify-between p-4 bg-white border-b print:hidden">
  <!-- Left side: Menu button and title -->
  <div class="flex items-center space-x-4">
    <button 
      (click)="toggleSidebar()"
      class="text-gray-600 p-2 rounded-md hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-[#276100]"
    >
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>
    <h2 class="text-xl font-semibold text-[#276100]">{{ pageTitle }}</h2>
  </div>

  <!-- Right side: User info and logout -->
  <div class="flex items-center space-x-4">
    <div class="text-sm text-gray-600">
      <span class="font-medium">{{ userName }}</span>
      <span class="text-xs block">{{ userRole }}</span>
    </div>
    <button 
      (click)="logout()"
      title="Đăng xuất"
      class="flex items-center space-x-2 text-gray-600 p-2 rounded-md hover:bg-red-100 hover:text-red-600 focus:outline-none focus:ring-2 focus:ring-red-500"
    >
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="h-6 w-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
      </svg>
      <span class="font-medium hidden sm:block">Đăng xuất</span>
    </button>
  </div>
</header>
