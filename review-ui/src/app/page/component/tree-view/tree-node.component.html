<div class="tree-node">
  <div class="node-content" [style.padding-left.rem]="level * 1.5">
    <!-- Toggle children -->
    <button 
      *ngIf="hasChildren()"
      (click)="onToggle()"
      class="toggle-btn"
      [class.expanded]="expanded">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
      </svg>
    </button>

    <!-- Placeholder for no children -->
    <div *ngIf="!hasChildren()" class="w-4"></div>

    <!-- Node Label -->
    <div class="node-label flex-1">
      <svg class="w-4 h-4 text-gray-600" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="currentColor">
        <path d="M200-280v-280h80v280h-80Zm240 0v-280h80v280h-80ZM80-120v-80h800v80H80Zm600-160v-280h80v280h-80ZM80-640v-80l400-200 400 200v80H80Zm178-80h444-444Zm0 0h444L480-830 258-720Z"/>
      </svg>
      <span class="font-medium text-gray-800">{{ node.name }}</span>
    </div>

    <!-- Toggle users button -->
    <button
      *ngIf="hasIndividuals()"
      (click)="toggleIndividuals()"
      class="ml-2 flex items-center gap-1 text-xs text-gray-500 hover:text-[#276100] transition-colors px-2 py-1 rounded hover:bg-gray-100"
    >
      <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24">
        <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
      </svg>
      {{ node.individuals?.length }} người
      <svg class="w-3 h-3 transition-transform" [class.rotate-180]="individualsExpanded" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
      </svg>
    </button>
  </div>

  <!-- Individuals — đóng/mở -->
  <div *ngIf="expanded && hasIndividuals() && individualsExpanded" class="individuals">
    <table class="individuals-table">
      <tbody>
        <tr *ngFor="let individual of node.individuals; let last = last" [class.border-b]="!last">
          <td class="col-user" [style.padding-left.rem]="(level + 1) * 1.5">
            <svg class="w-4 h-4 text-[#276100] flex-shrink-0" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"></path>
            </svg>
            <span class="truncate">{{ individual.name }}</span>
            <span *ngIf="individual.roleName" class="text-xs text-gray-400 ml-1 truncate">({{ individual.roleName }})</span>
          </td>
          <td *ngFor="let col of getEmptyColumns(); let colIndex = index" class="col-empty">
            <div class="checkbox-wrapper">
              <input 
                type="checkbox" 
                class="checkbox-input"
                [checked]="isChecked(individual, colIndex)"
                (change)="onCheckboxChange(individual, colIndex, $event)" />
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Children -->
  <div *ngIf="expanded && hasChildren()" class="children">
    <app-tree-node 
      *ngFor="let child of node.children"
      [node]="child"
      [level]="level + 1"
      [emptyColumnCount]="emptyColumnCount"
      [headers]="headers"
      [evaluationObjectHeaders]="evaluationObjectHeaders"
      (checkboxChange)="checkboxChange.emit($event)">
    </app-tree-node>
  </div>
</div>
