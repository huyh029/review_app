<div class="flex gap-3 relative">
  <button 
    type="button"
    (click)="toggleEmojiPicker()"
    class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6 text-yellow-400">
      <circle cx="12" cy="12" r="10"/>
      <circle cx="9" cy="9" r="1.5"/>
      <circle cx="15" cy="9" r="1.5"/>
      <path d="M9 15c1 1 2 1.5 3 1.5s2-.5 3-1.5"/>
    </svg>
  </button>
  
  <!-- Emoji Picker -->
  <div *ngIf="showEmojiPicker" class="absolute bottom-14 right-0 bg-white border border-gray-300 rounded-lg shadow-lg z-10 w-full min-w-[390px] max-w-2xl">
    <!-- Tab Navigation -->
    <div class="flex border-b border-gray-300 overflow-x-auto">
      <button 
        *ngFor="let category of getEmojiCategories()"
        type="button"
        [title]="category"
        (click)="selectEmojiCategory(category)"
        [class.border-b-2]="selectedEmojiCategory === category"
        [class.border-[#276100]]="selectedEmojiCategory === category"
        [class.text-[#276100]]="selectedEmojiCategory === category"
        [class.text-gray-600]="selectedEmojiCategory !== category"
        class="px-3 py-2 text-lg font-medium whitespace-nowrap hover:bg-gray-50 transition-colors">
        {{ getCategoryIcon(category) }}
      </button>
    </div>
    
    <!-- Emoji Grid -->
    <div class="p-3 max-h-80 overflow-y-auto" (scroll)="onEmojiGridScroll($event)">
      <div *ngFor="let category of getEmojiCategories()" [id]="'emoji-category-' + category" class="mb-4">
        <h4 class="text-xs font-semibold text-gray-600 mb-2 px-2 sticky top-0 bg-white">{{ category }}</h4>
        <div class="grid grid-cols-6 gap-2">
          <button 
            *ngFor="let emoji of emojiCategories[category]"
            type="button"
            (click)="selectIcon(emoji)"
            class="p-2 hover:bg-gray-100 rounded transition-colors flex items-center justify-center text-2xl">
            {{ emoji }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
