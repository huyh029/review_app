<div class="app-select relative w-full">
  <!-- Button -->
  <button
    type="button"
    (click)="toggleDropdown()"
    [disabled]="disabled"
    class="relative h-[42px] w-full cursor-default rounded-md bg-white py-2.5 pl-3 pr-10 text-left text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:outline-none focus:ring-2 focus:ring-[#276100] sm:text-sm disabled:bg-gray-100 disabled:shadow-none disabled:ring-gray-300 disabled:cursor-not-allowed disabled:text-gray-600 transition-all"
  >
    <span class="block truncate">{{ selectedLabel }}</span>
    <span class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-2">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 20 20"
        fill="currentColor"
        class="h-5 w-5 text-gray-400 transition-transform duration-200"
        [class.rotate-180]="isOpen"
      >
        <path
          fill-rule="evenodd"
          d="M5.233 7.21a.75.75 0 011.06 0L10 10.939l3.707-3.728a.75.75 0 111.06 1.06l-4.25 4.25a.75.75 0 01-1.06 0l-4.25-4.25a.75.75 0 010-1.06z"
          clip-rule="evenodd"
        ></path>
      </svg>
    </span>
  </button>

  <!-- Dropdown (Down) -->
  <div
    *ngIf="isOpen && direction === 'down'"
    class="absolute z-10 mt-1 w-full rounded-md bg-white shadow-lg ring-1 ring-black ring-opacity-5 focus:outline-none animate-in fade-in slide-in-from-top-1 duration-150"
  >
    <ul class="max-h-96 overflow-auto py-1">
      <li
        *ngFor="let option of options"
        (click)="selectOption(option)"
        [class.bg-[#276100]]="option.value === internalValue"
        [class.text-white]="option.value === internalValue"
        class="relative cursor-pointer select-none py-2 pl-3 pr-9 transition-colors duration-150"
        [class.hover:bg-gray-100]="option.value !== internalValue"
        [class.hover:bg-green-600]="option.value === internalValue"
      >
        <span class="block truncate" [class.font-semibold]="option.value === internalValue">
          {{ option.label }}
        </span>
        <span
          *ngIf="option.value === internalValue"
          class="absolute inset-y-0 right-0 flex items-center pr-4 text-white"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 20 20"
            fill="currentColor"
            class="h-5 w-5"
          >
            <path
              fill-rule="evenodd"
              d="M16.704 4.153a.75.75 0 01.044 1.06l-8.25 9.5a.75.75 0 01-1.072.052l-3.75-3.75a.75.75 0 111.06-1.06l3.045 3.045 7.573-8.724a.75.75 0 011.06-.044z"
              clip-rule="evenodd"
            ></path>
          </svg>
        </span>
      </li>
    </ul>
  </div>

  <!-- Dropdown (Up) -->
  <div
    *ngIf="isOpen && direction === 'up'"
    class="absolute z-10 bottom-full mb-1 w-full rounded-md bg-white shadow-lg ring-1 ring-black ring-opacity-5 focus:outline-none animate-in fade-in slide-in-from-bottom-1 duration-150"
  >
    <ul class="max-h-96 overflow-auto py-1">
      <li
        *ngFor="let option of options"
        (click)="selectOption(option)"
        [class.bg-[#276100]]="option.value === internalValue"
        [class.text-white]="option.value === internalValue"
        class="relative cursor-pointer select-none py-2 pl-3 pr-9 transition-colors duration-150"
        [class.hover:bg-gray-100]="option.value !== internalValue"
        [class.hover:bg-green-600]="option.value === internalValue"
      >
        <span class="block truncate" [class.font-semibold]="option.value === internalValue">
          {{ option.label }}
        </span>
        <span
          *ngIf="option.value === internalValue"
          class="absolute inset-y-0 right-0 flex items-center pr-4 text-white"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 20 20"
            fill="currentColor"
            class="h-5 w-5"
          >
            <path
              fill-rule="evenodd"
              d="M16.704 4.153a.75.75 0 01.044 1.06l-8.25 9.5a.75.75 0 01-1.072.052l-3.75-3.75a.75.75 0 111.06-1.06l3.045 3.045 7.573-8.724a.75.75 0 011.06-.044z"
              clip-rule="evenodd"
            ></path>
          </svg>
        </span>
      </li>
    </ul>
  </div>
</div>
