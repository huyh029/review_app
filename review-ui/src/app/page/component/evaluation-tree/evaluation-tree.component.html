<div class="tree-section">
  <div class="tree-container">
    <div class="table-header">
      <div class="table-row">
        <div class="table-cell drag-column"></div>
        <div class="table-cell">{{ getItemTypeLabelCapitalized() }}</div>
        <div class="table-cell">Hoạt động</div>
      </div>
    </div>
    <div class="table-body">
      <ng-container *ngFor="let item of getVisibleItems()">
        <div class="table-row tree-row" 
          [class.dragging]="item.isDragging" 
          [class.drop-target-top]="dropTargetId === item.id && dropZonePosition === 'top'" 
          [class.drop-target-bottom]="dropTargetId === item.id && dropZonePosition === 'bottom'"
          [class.drop-target-inside]="dropTargetId === item.id && dropZonePosition === 'inside'"
          (dragover)="onDragOverRow($event, item)" 
          (dragleave)="onDragLeave($event)" 
          (drop)="onDrop($event, item)"
          (mouseenter)="hoveredItemId = item.id ?? null"
          (mouseleave)="hoveredItemId = null"
          style="position: relative;">
          
          <!-- Drag cell -->
          <div class="table-cell drag-cell">
            <div class="drag-handle" draggable="true" (dragstart)="onDragStart($event, item)" (dragend)="onDragEnd()" title="Kéo để sắp xếp">
              <svg fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4">
                <circle cx="9" cy="5" r="1.5"></circle>
                <circle cx="9" cy="12" r="1.5"></circle>
                <circle cx="9" cy="19" r="1.5"></circle>
                <circle cx="15" cy="5" r="1.5"></circle>
                <circle cx="15" cy="12" r="1.5"></circle>
                <circle cx="15" cy="19" r="1.5"></circle>
              </svg>
            </div>
          </div>

          <!-- Name cell -->
          <div class="table-cell editable-cell">
            <div style="display: flex; align-items: center; gap: 4px;" [style.padding-left]="((item.level ?? 0) * 20) + 'px'">
              <div class="expand-button-slot">
                <button 
                  *ngIf="hasChildren(item)"
                  type="button" 
                  class="btn-expand"
                  (click)="toggleExpand(item); $event.stopPropagation()"
                  [class.expanded]="item.expanded"
                  tabindex="-1"
                >
                  <svg *ngIf="item.expanded" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-500 transition-transform flex-shrink-0 rotate-90"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                  <svg *ngIf="!item.expanded" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-500 transition-transform flex-shrink-0"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
              </div>
              
              <!-- Name input with dropdown -->
              <div class="name-input-wrapper">
                <input 
                  type="text" 
                  [(ngModel)]="item.name"
                  (input)="onNameInputChange(item)"
                  (focus)="onNameInputFocus(item)"
                  (blur)="onNameInputBlurEvent(item)"
                  (keydown)="onNameKeydown($event, item)"
                  class="name-input"
                  [placeholder]="'Nhập tên ' + getItemTypeLabel()"
                />
                <div class="item-dropdown" *ngIf="focusedItemId === item.id && getFilteredItems(item.name).length > 0">
                  <div class="item-option" 
                    *ngFor="let option of getFilteredItems(item.name); let i = index" 
                    [class.selected]="selectedItemIndex === i"
                    (mousedown)="$event.preventDefault(); isSelectingItem = true"
                    (click)="selectItem(item, option); $event.stopPropagation()">
                    {{ option.name }}
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Actions cell -->
          <div class="table-cell editable-cell">
            <span style="display: flex;" class="actions">
              <button class="btn-icon btn-add-row" type="button" [title]="'Thêm ' + getItemTypeLabel() + ' con'" (click)="onAddItem(item)" tabindex="-1">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
              </button>
              <button class="btn-icon btn-danger" type="button" title="Xóa" (click)="onDeleteItem(item.id)" tabindex="-1">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                  <line x1="10" y1="11" x2="10" y2="17"></line>
                  <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
              </button>
            </span>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
</div>
