<div *ngIf="pagination" class="pagination-footer flex items-center justify-between text-sm text-gray-700 print:hidden bg-white border-gray-400 p-4">
  <div class="flex items-center space-x-2">
    <span>Hiển thị</span>
    <div class="w-32">
      <app-select 
        [options]="itemsPerPageOptions"
        [(ngModel)]="itemsPerPage"
        (ngModelChange)="onItemsPerPageChange()"
        direction="up"
      ></app-select>
    </div>
    <span>dòng</span>
  </div>

  <div>
    <span>Hiển thị {{ (pagination.currentPage - 1) * itemsPerPage + 1 }} - {{ Math.min(pagination.currentPage * itemsPerPage, pagination.totalItems) }} trên tổng số {{ pagination.totalItems }} mục</span>
  </div>

  <div class="flex items-center space-x-1">
    <button 
      (click)="previousPage()"
      [disabled]="pagination.currentPage === 1"
      class="px-3 py-1 border border-gray-300 rounded-md disabled:opacity-50 disabled:cursor-not-allowed hover:bg-gray-100 transition-colors">
      Trước
    </button>

    <button 
      *ngFor="let page of getPageNumbers()"
      (click)="typeof page === 'number' && goToPage(page)"
      [disabled]="typeof page === 'string'"
      [class.bg-[#276100]]="page === pagination.currentPage"
      [class.text-white]="page === pagination.currentPage"
      class="px-3 py-1 border border-gray-300 rounded-md transition-colors hover:bg-gray-100 disabled:cursor-default disabled:hover:bg-white"
      [class.hover:bg-gray-100]="page !== pagination.currentPage && typeof page === 'number'">
      {{ page }}
    </button>

    <button 
      (click)="nextPage()"
      [disabled]="pagination.currentPage === pagination.totalPages"
      class="px-3 py-1 border border-gray-300 rounded-md disabled:opacity-50 disabled:cursor-not-allowed hover:bg-gray-100 transition-colors">
      Sau
    </button>
  </div>
</div>
