<div *ngIf="isOpen" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
  <div class="bg-white rounded-lg shadow-lg p-8 max-w-md w-full mx-4">
    <!-- Icon -->
    <div class="flex justify-center mb-4">
      <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20" class="mx-auto mb-4 text-gray-400 w-12 h-12">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 11V6m0 8h.01M19 10a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"></path>
      </svg>
    </div>

    <!-- Message -->
    <h2 class="text-center text-lg font-semibold text-gray-800 mb-2">{{ title }}</h2>
    <p class="text-center text-gray-600 mb-6">{{ message }}</p>

    <!-- Buttons -->
    <div class="flex gap-4 justify-center">
      <button 
        (click)="onCancel()"
        class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 font-medium hover:bg-gray-50 transition-colors">
        {{ cancelText }}
      </button>
      <button 
        (click)="onConfirm()"
        [class]="'px-6 py-2 text-white rounded-lg font-medium transition-colors ' + confirmButtonClass">
        {{ confirmText }}
      </button>
    </div>
  </div>
</div>
