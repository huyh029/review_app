<div class="criteria-classification-section">
  <div class="section-header">
    <h3>Phân loại đánh giá</h3>
    <button class="btn-add-classification" (click)="onAddClassification()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      Thêm phân loại
    </button>
  </div>

  <div class="classification-table">
    <div class="table-header">
      <div class="table-row">
        <div class="table-cell">Mã</div>
        <div class="table-cell">Tên phân loại</div>
        <div class="table-cell">Tên viết tắt</div>
        <div class="table-cell">Điểm từ</div>
        <div class="table-cell">Điểm đến</div>
        <div class="table-cell">Hành động</div>
      </div>
    </div>

    <div class="table-body">
      <ng-container *ngFor="let item of classifications">
        <div class="table-row" [class.dragging]="item.isDragging" [class.drop-target-top]="dropTargetId === item.id && dropZonePosition === 'top'" [class.drop-target-bottom]="dropTargetId === item.id && dropZonePosition === 'bottom'" (dragover)="onDragOverRow($event, item)" (dragleave)="onDragLeave($event)" (drop)="onDrop($event, item)" (mouseenter)="hoveredItemId = item.id ?? null" (mouseleave)="hoveredItemId = null" style="position: relative;">
          <div class="table-cell">
            <input 
              type="text" 
              [(ngModel)]="item.code"
              (blur)="finishEdit(item)"
              (keyup.enter)="finishEdit(item)"
              class="cell-input"
            />
          </div>
          <div class="table-cell">
            <input 
              type="text" 
              [(ngModel)]="item.name"
              (blur)="finishEdit(item)"
              (keyup.enter)="finishEdit(item)"
              class="cell-input"
            />
          </div>
          <div class="table-cell">
            <input 
              type="text" 
              [(ngModel)]="item.shortName"
              (blur)="finishEdit(item)"
              (keyup.enter)="finishEdit(item)"
              class="cell-input"
            />
          </div>
          <div class="table-cell score-from-cell">
            <input 
              type="number" 
              [(ngModel)]="item.scoreFrom"
              (blur)="finishEdit(item)"
              (keyup.enter)="finishEdit(item)"
              (input)="validateScore(item)"
              class="cell-input"
              readonly
              min="0"
              max="100"
            />
          </div>
          <div class="table-cell">
            <input 
              type="number" 
              [(ngModel)]="item.scoreTo"
              (blur)="onScoreToBlur(item)"
              (keyup.enter)="finishEdit(item)"
              (input)="validateScore(item)"
              (keydown)="onScoreToKeydown($event, item)"
              class="cell-input"
              min="0"
              max="100"
            />
          </div>
          <div class="table-cell">
            <button class="btn-icon btn-danger" type="button" title="Xóa" (click)="onDelete(item.id)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
              </svg>
            </button>
          </div>
          <button *ngIf="hoveredItemId === item.id" class="btn-insert-row btn-insert-above" (click)="onInsertRowBefore(item)" title="Thêm hàng phía trên">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="insert-icon">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="16"></line>
              <line x1="8" y1="12" x2="16" y2="12"></line>
            </svg>
          </button>
          <button *ngIf="hoveredItemId === item.id" class="btn-insert-row btn-insert-below" (click)="onInsertRowAfter(item)" title="Thêm hàng phía dưới">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="insert-icon">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="16"></line>
              <line x1="8" y1="12" x2="16" y2="12"></line>
            </svg>
          </button>
        </div>
      </ng-container>
    </div>
  </div>
</div>
