<div>
  <app-filter 
    [fields]="filterFields"
    [searchPlaceholder]="'Tìm kiếm theo tên, đơn vị...'"
    [searchMode]="'click'"
    (filterChange)="onFilterChange($event)">
  </app-filter>

  <!-- Title and Actions -->
  <div class="flex items-center justify-between mt-6 mb-4">
    <h2 class="text-lg font-semibold text-gray-800">Danh sách - Tự đánh giá</h2>
    <div class="flex gap-3">
      <app-download-button></app-download-button>
      
      <button 
        *ngIf="deleteCount > 0"
        (click)="onDelete()"
        class="flex items-center gap-2 px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
        </svg>
        <span>Xóa ({{ deleteCount }})</span>
      </button>
      <button 
        (click)="onAddNew()"
        class="flex items-center gap-2 px-4 py-2 bg-[#276100] text-white rounded-lg hover:bg-[#1f4a00] transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
        </svg>
        <span>Thêm mới</span>
      </button>
    </div>
  </div>

  <!-- Table -->
  <app-table
    #table
    [columns]="columns"
    [response]="tableResponse"
    [enableMultiSelect]="enableMultiSelect"
    [selectionFilter]="selectionFilter"
    [isAll]="isAllSelected"
    [includeIds]="includeIds"
    [excludeIds]="excludeIds"
    [totalSelectedCount]="deleteCount"
    (isAllChange)="onIsAllChange($event)"
    (includeIdsChange)="onIncludeIdsChange($event)"
    (excludeIdsChange)="onExcludeIdsChange($event)"
    (rowActionClick)="onRowActionClick($event)">
  </app-table>

  <!-- Confirmation Dialog -->
  <app-confirmation-dialog
    [isOpen]="showConfirmDialog"
    title="Xác nhận xóa"
    [message]="getDeleteMessage()"
    cancelText="Hủy"
    confirmText="Xóa"
    (confirm)="onConfirmDelete()"
    (cancel)="onCancelDelete()">
  </app-confirmation-dialog>
</div>
