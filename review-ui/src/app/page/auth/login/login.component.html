<div class="w-full h-screen flex justify-center items-center bg-gray-50">
  <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-sm flex flex-col gap-5">

    <div class="text-center">
      <h1 class="text-2xl font-bold text-[#276100]">Đăng nhập</h1>
      <p class="text-gray-400 text-sm mt-1">Hệ thống đánh giá</p>
    </div>

    <!-- Keycloak SSO -->
    <button
      (click)="loginKeycloak()"
      class="flex items-center justify-center gap-3 w-full border border-[#276100] text-[#276100] rounded-xl py-3 text-sm font-medium hover:bg-[#276100] hover:text-white transition-all"
    >
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
      </svg>
      Đăng nhập bằng Keycloak
    </button>

    <div class="flex items-center gap-3">
      <div class="flex-1 h-px bg-gray-200"></div>
      <span class="text-xs text-gray-400">hoặc</span>
      <div class="flex-1 h-px bg-gray-200"></div>
    </div>

    <!-- Local login -->
    <div class="flex flex-col gap-3">
      <input
        type="text"
        placeholder="Nhập User ID"
        class="border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-[#276100] transition-all"
        [(ngModel)]="id"
        [disabled]="loading"
        (keydown)="onEnter($event)"
      />
      <button
        (click)="loginLocal()"
        [disabled]="loading"
        class="bg-gray-100 text-gray-700 rounded-xl py-3 text-sm font-medium disabled:opacity-50 hover:bg-gray-200 transition-all"
      >
        {{ loading ? 'Đang đăng nhập...' : 'Đăng nhập nội bộ' }}
      </button>
    </div>

    <div *ngIf="error" class="text-red-500 text-sm text-center bg-red-50 rounded-xl px-4 py-2">
      {{ error }}
    </div>

  </div>
</div>
